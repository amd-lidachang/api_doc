version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
  commands:
    - pip install sphinx==7.4.7 sphinx-rtd-theme breathe
    - doxygen Doxyfile || true
    - sphinx-build -b html . $READTHEDOCS_OUTPUT/html

sphinx:
  configuration: conf.py

python:
  install:
    - requirements: requirements.txt
